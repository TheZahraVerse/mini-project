version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: melkjo_db
      POSTGRES_USER: melkjo_user
      POSTGRES_PASSWORD: melkjo_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://melkjo_user:melkjo_pass@db:5432/melkjo_db

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"

volumes:
  postgres_data: